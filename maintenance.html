<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Furutec — Temporarily Offline</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink:      #111114;
    --ink-mut:  #4A4A52;
    --ink-sub:  #6B6B73;
    --brand:    #2E3192;
    --line:     #ECECF1;
    --bg:       #F4F6FB;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    background: linear-gradient(180deg, #FAFBFF 0%, var(--bg) 100%);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 520px;
    background: #FFFFFF;
    padding: 48px 40px 40px;
    text-align: center;
    box-shadow: 0 14px 40px rgba(17,17,20,0.08);
    border: 1px solid var(--line);
  }
  .logo {
    display: inline-block; margin-bottom: 28px;
    max-height: 54px; height: 54px; width: auto;
  }
  h1 {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0 0 14px;
  }
  h1 span { color: var(--brand); }
  .lede {
    font-size: 15px; line-height: 1.6;
    color: var(--ink-mut);
    margin: 0 0 28px;
  }
  .divider {
    height: 1px; background: var(--line);
    margin: 8px 0 22px;
  }
  .contact-label {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-sub);
    margin: 0 0 12px;
  }
  .contact-row {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin: 8px 0;
    font-size: 14px; color: var(--ink);
  }
  .contact-row a { color: var(--brand); text-decoration: none; font-weight: 600; }
  .contact-row a:hover { text-decoration: underline; }
  .contact-row svg { flex-shrink: 0; }
  .footer {
    margin-top: 32px; padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink-sub); letter-spacing: 0.2px;
  }
</style>
</head>
<body>
  <main class="card" role="main">
    <img class="logo" src="assets/Logo.jpeg" alt="Furutec"/>
    <h1>We'll be back <span>shortly.</span></h1>
    <p class="lede">
      Our website is temporarily offline while we finalise a few things.
      Please check back soon — or reach us directly using the details below.
    </p>

    <div class="divider"></div>

    <p class="contact-label">Contact Us Directly</p>

    <div class="contact-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E3192" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <a href="mailto:info@furutec.com.my">info@furutec.com.my</a>
    </div>

    <div class="contact-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E3192" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2 1a12 12 0 0 0 5 5l1-2 5 2v4a1 1 0 0 1-1 1A17 17 0 0 1 4 5a1 1 0 0 1 1-1Z"/></svg>
      <span>+6012-887 4517</span>
    </div>

    <div class="footer">
      Furutec Electrical Sdn Bhd
    </div>
  </main>
</body>
</html>
